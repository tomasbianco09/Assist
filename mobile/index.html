<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12303B">
  <title>Assist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <span class="brand">Assist</span>
      <span class="who" id="who"></span>
    </header>

    <main id="screen" aria-live="polite"></main>

    <details class="demo" id="demo" hidden>
      <summary>Modo prueba</summary>
      <p>Simula que un familiar pide ver la pantalla (usa el ID de un vínculo ya creado).</p>
      <div class="demo-row">
        <input id="demoVinculo" type="number" min="1" value="1" aria-label="ID del vínculo">
        <button type="button" id="demoBtn">Simular solicitud</button>
      </div>
      <p id="demoMsg" class="demo-msg"></p>
    </details>
  </div>
  <script src="app.js"></script>
</body>
</html>
